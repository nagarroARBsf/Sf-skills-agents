name: sf-sdlc kit checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (hooks and CLI)
        run: node --test tests/kit.test.js
      - name: Plugin and catalog are regenerated
        run: python3 scripts/build-claude-plugin.py --check
      - name: Hook and settings JSON are valid
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/sf-sdlc/hooks/hooks.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/sf-sdlc/.claude-plugin/plugin.json','utf8'))"
      # `claude plugin validate plugins/sf-sdlc --strict` needs the Claude Code CLI; run it locally before a release.
